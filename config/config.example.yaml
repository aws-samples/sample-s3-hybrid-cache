# Example configuration for Hybrid Cache for Amazon S3.
#
# docs/CONFIGURATION.md lists every field with its type, default and valid range.
# Commented-out lines show optional settings, most of them at their defaults.
# Durations take forms such as "500ms", "30s", "5m", "1h" and "1d".
# Fields that still load but have no effect are listed near the top of
# docs/CONFIGURATION.md.

server:
  # "standard" (default): the HTTP listener on http_port and HTTPS passthrough on
  # https_port. "proxy_only": only the forward proxy on proxy_port, which needs no
  # root privileges and no DNS or /etc/hosts changes. In both modes the TLS proxy
  # listener (server.tls below) also runs when it is enabled.
  mode: "standard"
  # Forward proxy port in proxy_only mode (default: 3128); ignored in standard mode.
  # The hop to it is cleartext, so use it from the proxy's own host
  # (HTTP_PROXY=http://127.0.0.1:3128) or across a secure network segment.
  proxy_port: 3128
  # HTTP listener (default: 80). Clients reach it through a DNS zone or hosts file that
  # resolves S3 hostnames to the proxy, with --endpoint-url http://s3.<region>.amazonaws.com.
  # The hop is cleartext, so use it on the proxy's own host or a secure network segment.
  http_port: 80
  # HTTPS passthrough (default: 443): HTTPS connections pass through to S3 unchanged
  # and are not cached.
  https_port: 443
  # Maximum concurrent requests (default: 1000). A request holds its permit until its
  # response body has finished streaming to the client, so long downloads hold permits
  # longer.
  # On the streaming paths each request uses about 5-6 MiB: a cache hit about 1 MiB of
  # chunk buffer, up to 4 MiB of channel backpressure and up to 0.4 MiB of LZ4 state.
  # A cache miss uses about 1 MiB of tee buffer and up to 4 MiB of cache write buffer.
  # Proxy memory is about 200 MiB + max_concurrent_requests x 6 MiB: 1,400 MiB at 200,
  # 3,200 MiB at 500, 6,200 MiB at 1000 and 12,200 MiB at 2000. Paths that buffer a
  # whole body or range are bounded separately, by max_inflight_buffer_bytes.
  # Starting points: 50-100 for fewer than 50 clients, 100-300 for 50-500 clients, and
  # 300-1000 or more above that. Confirm against permits_held_peak in /metrics.
  max_concurrent_requests: 1000
  request_timeout: "30s"
  # Adds a Referer header naming the proxy, "Hybrid Cache for Amazon S3/<version>
  # (<hostname>)", which S3 server access logs record (default: true).
  add_referer_header: true
  # Frames queued between a streamed PUT or UploadPart body and the write cache
  # (default: 5). The body goes to S3 as it arrives, and each frame is also queued for
  # the cache. A connection holds one frame in flight plus this many queued, and a frame
  # is at most one HTTP read buffer, so the memory does not grow with object size.
  # write_cache_tee_channel_depth: 5

  # Ceiling on the bytes held at once by all the request and response bodies the proxy
  # buffers whole instead of streaming (default: 0, no ceiling). Most are responses
  # (range merges, page widening, buffered range serving, recovery fallbacks); the rest
  # are small non-GET/PUT request bodies such as a DeleteObjects POST. Uploads always
  # stream, and max_concurrent_requests bounds them instead.
  # A request whose buffered body would pass the ceiling gets HTTP 503 SlowDown with
  # Retry-After, not 413, before any upstream connection opens.
  # Start at about instance RAM / 4 - cache.max_ram_cache_size, then adjust against
  # inflight_memory.peak_reserved_bytes in /metrics under real traffic. On a 4 GiB
  # c6in.large with the default 512 MiB RAM cache that is 536870912 (512 MiB).
  # A value above 0 and below 1 MiB fails validation at startup.
  # max_inflight_buffer_bytes: 0

  # TLS proxy listener (port 3129), the recommended way for clients to reach the proxy.
  # It terminates TLS with the proxy's own certificate and sends the decrypted requests
  # through the cache. Clients set HTTP_PROXY=https://<proxy-host>:3129 and
  # --endpoint-url http://s3.<region>.amazonaws.com. It is separate from https_port,
  # which passes HTTPS through without caching.
  # See docs/GETTING_STARTED.md, "Configure client routing".
  tls:
    enabled: false  # Default: false
    tls_proxy_port: 3129  # Default: 3129
    cert_path: "/etc/proxy/tls/cert.pem"  # PEM certificate chain
    key_path: "/etc/proxy/tls/key.pem"  # PEM private key

cache:
  cache_dir: "./tmp/cache"  # Local development; use an absolute path in production, e.g. "/mnt/cache"
  max_cache_size: 524288000  # 500 MiB; the default is 10 GiB (10737418240)
  ram_cache_enabled: true  # Default: false
  # RAM cache size in bytes (default: 512 MiB). With the default 8 shards each shard
  # gets 64 MiB, the RAM cache's admission ceiling, so any entry up to 64 MiB fits.
  max_ram_cache_size: 536870912  # 512 MiB
  # Number of RAM cache shards, each with its own lock (default: 8; range 1-256).
  # Each shard holds max_ram_cache_size divided by the effective shard count,
  # min(ram_cache_shard_count, max(1, max_ram_cache_size / 67108864)), so a shard holds
  # at least 64 MiB whenever the RAM cache does. An entry larger than a shard is not
  # admitted to the RAM cache and is served from disk.
  # Example: 256 MiB with 8 shards runs as 4 shards of 64 MiB.
  # More shards (16 to 64) mean less lock contention when hundreds of concurrent
  # requests hit distinct keys; raise max_ram_cache_size with them, or the clamp undoes
  # the increase. Fewer shards (1 or 2) suit a cache dominated by a few large objects.
  ram_cache_shard_count: 8
  # Eviction algorithm for the RAM and disk caches. "tinylfu", the default and only
  # algorithm, ranks entries by decayed access frequency and recency together.
  eviction_algorithm: "tinylfu"

  # Write cache: the proxy caches PUT and multipart upload bodies that S3 accepts, so a
  # later GET can be served from the cache (default: true). When false, writes go to S3
  # without being cached.
  write_cache_enabled: true

  # Share of max_cache_size reserved for the write cache, in percent (default: 10.0).
  # The proxy uses the value as set, with no clamp or range check. It is a reclamation target.
  # Uploads are still cached when the share is full, and the proxy reclaims the excess
  # in the background, from eviction_trigger_percent down to eviction_target_percent of
  # the share. Objects whose put_ttl expired unread go first, then the oldest.
  # Raise it if a larger set of written but unread objects should stay cached.
  # An upload is not cached when caching it would take the cache past max_cache_size, or
  # would leave less free space than disk_safety_free_space_floor. The upload itself
  # always goes to S3. See docs/EVICTION.md.
  write_cache_percent: 10.0

  # Free space to keep on the cache volume, in bytes (default: 1 GiB). Every cache write
  # checks it, from the write cache and from GET-miss fills alike: caching is skipped
  # when the volume has less than this free beyond the object's own size. The client
  # request goes ahead either way.
  # Size it for every writer on the volume together, including anything other than the
  # proxies. A proxy works from a free-space reading up to 5 seconds old, and takes an
  # exact reading for each write only inside a danger band of 4 x this floor. Outside
  # the band every writer can admit 5 seconds of writes against its old reading, so:
  #   floor >= (5s x combined fill rate of every writer + largest cached object) / 4
  # At a 2 GiB/s fleet cache-miss rate and a 256 MiB largest object that is about
  # 2.6 GiB, so the 1 GiB default is too small for a busy fleet and suits moderate traffic
  # from one proxy on a small volume. Inside the band, writes also take a fleet-wide reservation, so the proxies
  # cannot overshoot together. Raising the floor widens the band with it.
  # 0 turns off the floor and the band, leaving only the handling of a full disk
  # (ENOSPC) after the fact; that is not recommended for a fleet.
  disk_safety_free_space_floor: 1073741824  # 1 GiB in bytes

  # Largest object the write cache stores (default: 256 MiB). A larger PUT goes to S3
  # without being cached.
  write_cache_max_object_size: 268435456  # 256 MiB in bytes

  # How long an object in the write cache stays cached before its first GET (default:
  # 1h; at most 315360000s). The first GET moves the entry to get_ttl, once only. That
  # needs the object's Last-Modified, which S3's write responses omit, so the first GET
  # revalidates with S3 to learn it.
  put_ttl: "3600s"  # 1 hour

  # How long an incomplete multipart upload stays cached before it is removed (default:
  # 1d; range 1h-7d, and a value outside it falls back to 1d with a warning).
  incomplete_upload_ttl: "1d"  # 1 day

  # Largest CompleteMultipartUpload request body accepted, in bytes (default: 10 MiB).
  # A larger body gets HTTP 413 before anything is sent to S3. The default leaves room
  # for S3's maximum of 10,000 parts.
  # max_complete_body_bytes: 10485760

  # How long a cached object is served without contacting S3 (default: 1d; at most
  # 315360000s, 10 years). After it expires, the next GET sends S3 a conditional
  # request, and an unchanged object costs a 304 with no body transfer. This bounds how
  # long the cache serves an object that was overwritten or deleted without passing
  # through this proxy. For immutable data, set a longer value here or for a prefix in
  # cache_rules.json.
  get_ttl: "1d"  # 1 day (default)
  head_ttl: "60s"  # How long a cached HEAD response is served without contacting S3 (default: 60s)
  actively_remove_cached_data: false  # false (default) removes expired entries when next requested; true also removes them in the background

  # Window for recent access by other proxies (default: 10s; range 10-600s, and a value
  # outside it falls back to 10s with a warning). Despite the name, it governs no flush.
  # A journal entry younger than twice this value counts as another proxy's recent
  # access to the object, and eviction refreshes its view of that activity every half
  # of this value.
  ram_cache_flush_interval: "10s"        # Default: 10s
  # How long a RAM cache range hit is trusted before it is checked against the .meta
  # file on the cache volume (default: 1s; range 0-60s, and a larger value falls back
  # to 1s with a warning). Within the interval a hit is served from RAM, bytes and
  # headers, without reading the cache volume. After it, the proxy reads the .meta once
  # per key, shared by concurrent requests, and compares its ETag with the RAM entry's.
  # This bounds how stale a RAM-served response can be relative to the rest of the
  # fleet, inside the key's get_ttl. A key whose get_ttl is "0s" never takes a RAM range
  # path. 0s checks every hit.
  ram_cache_verification_interval: "1s"
  
  # ============================================================================
  # Coordination on the cache volume
  # ============================================================================
  # Journal-based metadata updates and the eviction lock. These are always on: they
  # keep a fleet sharing one cache volume (NFS, a shared PersistentVolume) consistent,
  # and a single proxy uses them too.
  # ============================================================================
  shared_storage:

    # How long acquiring a key's metadata lock waits before giving up (default: 5s;
    # range 1-300s). It bounds the wait only, because metadata locks never expire. When
    # it runs out, the request fails with a retryable contention error and has changed
    # nothing; a lock that another proxy still holds is never taken over. Raise it to
    # wait longer rather than fail under contention.
    lock_acquire_wait_budget: "5s"

    # The eviction lock lets one proxy at a time choose what to evict, so the fleet does
    # not evict more than it needs. It is a flock, never taken over while held: it is
    # released when its holder finishes or exits. After this long, a proxy that found
    # the lock held tries once more, which succeeds only if the holder has let go in the
    # meantime (counted by eviction_coordination.stale_locks_recovered in /metrics).
    # Changing it never lets two proxies evict at once. Default: 60s; range 30-3600s.
    # See docs/SHARED_STORAGE.md, "Distributed eviction".
    eviction_lock_timeout: "60s"

    # Percentage of cache inconsistency that logs a warning (default: 5.0) or an error
    # (default: 20.0). Range 0.0-100.0, and the warning level must be below the error level.
    validation_threshold_warn: 5.0
    validation_threshold_error: 20.0


    # How often journal entries are folded into the metadata files (default: 5s; range
    # 1-60s). A shorter interval makes one proxy's cache writes visible to the others
    # sooner.
    consolidation_interval: "5s"

    # Longest time the per-key phase of one consolidation cycle may run (default: 30s),
    # so one slow NFS operation cannot hold up the next cycle. Keys left over are
    # retried in the next cycle.
    consolidation_cycle_timeout: "30s"

    # Number of times to retry acquiring a lock before giving up (default: 5; range 1-20).
    lock_max_retries: 5

    # Has no effect: nothing reads it, though a value outside 1-168 hours still fails
    # validation. See docs/CONFIGURATION.md, "Validation scan".
    validation_frequency: "23h"

    # Eviction uses a shared work list: the proxy holding the eviction lock writes what
    # it selected, and every proxy deletes part of it. This is how long a proxy holds the
    # lease on one chunk of the list while it deletes (default: 900s; range 760s-24h).
    # A lock_acquire_wait_budget above 5s can make the proxy use a longer lease.
    # eviction_worklist_lease: "900s"

    # Longest time one validation scan cycle may run (default: 4h; range 10m-23h). It
    # also picks the scan mode: when a full scan would exceed it, the next cycle switches
    # to rolling mode, which scans part of the directories each cycle and resumes in the
    # next. When rolling mode estimates that a full scan would fit, it switches back.
    validation_max_duration: "4h"

    # Interval between size-fold passes (default: 1h; range 5m-7d). A pass lists and
    # stats every range file to recompute each shard's byte total. It reads no metadata
    # files, so it runs on its own schedule rather than with the validation scan.
    # The value is a minimum: the interval is never shorter than twice the last pass's
    # duration, and passes never overlap, so on a large volume the interval lengthens by
    # itself. Each pass costs one directory listing per cache leaf and one
    # stat per range file, which on EFS, NFS or FSx is I/O against the volume; lengthen
    # the interval if passes compete with request traffic.
    shard_fold_interval: "1h"

    # Longest time one size-fold pass may run (default: 30m; range 1m-24h). The budget is
    # checked before each shard, never inside one, so a pass that runs out leaves each
    # shard it reached with a fresh total and each shard it did not with its previous
    # one. The per-shard scan ages show which is which.
    shard_fold_max_duration: "30m"

    # Smallest compressed range, in bytes, that eviction's index of large ranges holds
    # (default: 1048576, 1 MiB; range 4096 to 1073741824). The index lets an eviction
    # pass find the largest ranges in each shard without reading every metadata file.
    # The size is the compressed size, which is what evicting the range frees.
    # tail_max_entries decides which ranges the index keeps; this floor only keeps tiny
    # ranges out. Raise it on a cache of very large objects to shrink the index. Lower it
    # on a cache of mostly sub-MiB objects, where the default leaves the index empty and
    # eviction has nothing to choose from.
    tail_floor_bytes: 1048576

    # Number of the largest indexed ranges kept per cache shard (default: 4096; range
    # 1-1048576). Because the cap is per shard, a shard's index stays the same size
    # however much the shard holds. Raise it if eviction reports that it could not free
    # as much as it was asked to while the cache is full.
    tail_max_entries: 4096

    # Number of the largest ranges each proxy records between index rebuilds (default:
    # 4096; range 1-1048576). Ranges cached since a shard's index was rebuilt go into a
    # small per-proxy file, so eviction sees them before the next rebuild; this caps the
    # file, so reading it costs the same however full the cache is. Keep it at or above
    # tail_max_entries, or a range just cached could be dropped while an indexed range of
    # the same size is kept.
    tail_delta_max_entries: 4096

  # ============================================================================
  # Download coordination
  # ============================================================================
  # When several requests miss on the same object at once, one request fetches it
  # from S3 and the others wait for that fetch.
  # ============================================================================
  download_coordination:
    # Coalesce concurrent misses on the same object (default: true). When false, every
    # miss fetches from S3 on its own.
    enabled: true

    # How long a waiting request waits for the fetch (default: 30s; range 5-120s, and a
    # value outside it is clamped with a warning). If the fetch is still running, the
    # waiter waits on the same fetch again, up to max_waiter_resubscriptions times
    # (default: 3), then returns 504 Gateway Timeout. A waiter fetches from S3 itself
    # only when the fetch it waits on fails or goes away.
    wait_timeout_secs: 30

  # Range merge gap threshold (default: 1 MiB).
  range_merge_gap_threshold: 1048576  # 1 MiB in bytes

  # Eviction starts when the cache reaches eviction_trigger_percent of max_cache_size
  # and stops when it is down to eviction_target_percent. The gap between them keeps
  # eviction from starting and stopping repeatedly near the limit.
  # eviction_trigger_percent: default 95; values outside 50-100 are clamped.
  # eviction_target_percent: default 80; values outside 50-99 are clamped. A target at
  # or above the trigger is set to the trigger minus 10 (at least 50), with a warning.
  eviction_trigger_percent: 95
  eviction_target_percent: 80

  # Honor client cache-bypass headers (default: true). A request carrying
  # `Cache-Control: no-cache`, `Pragma: no-cache` or `Cache-Control: no-store` then
  # bypasses the cache. Set false to ignore them, so clients cannot opt out of caching.
  cache_bypass_headers_enabled: true

  # Cache initialization at startup. Accepted and ignored: nothing reads these
  # fields, and a non-default value logs a startup warning.
  initialization:
    parallel_scan: true
    scan_timeout: "30s"
    progress_logging: true

  # ============================================================================
  # RAM metadata cache
  # ============================================================================
  # Keeps object metadata (.meta files) in RAM for HEAD and GET requests. A hit is
  # served from RAM; a miss or a stale entry is read from disk and cached. Entries
  # are of similar size, so eviction is plain LRU. Each entry takes about
  # 1.5-2.5 KiB, so 10,000 entries take about 15-25 MiB.
  # ============================================================================
  metadata_cache:
    # Turn the RAM metadata cache on or off (default: true). When off, every metadata
    # read goes to disk.
    enabled: true

    # Age after which an entry is re-read from disk (default: 5s). Lower values mean
    # fresher metadata and more disk I/O. Documented range 1-300s, not enforced: a
    # value outside it is used as configured and logs a startup warning.
    refresh_interval: "5s"

    # Maximum entries (default: 100000, about 150-250 MiB of RAM). Raise it for
    # workloads with many distinct objects. Documented range 100-1000000, not enforced:
    # a value outside it is used as configured and logs a startup warning.
    max_entries: 100000

  # Object size above which a range request skips the check for a cached full-object
  # range (default: 64 MiB). A large object is rarely cached as one full-object range,
  # so the check would scan many cached ranges for nothing.
  full_object_check_threshold: 67108864  # 64 MiB in bytes

  # Read cache for GET responses (default: true). When false, nothing is read-cached
  # except keys a cache_rules.json rule enables with read_cache_enabled: true, which
  # gives an allowlist of cached keys.
  read_cache_enabled: true

  # Answer a GET, range GET or HEAD whose only conditional header is If-Match or
  # If-Range from the cache (default: true). With true, an unexpired entry under a
  # non-zero get_ttl whose ETag matches is served without contacting S3; an If-Range
  # validator must strong-match the cached ETag, and a HEAD also needs its cached HEAD
  # entry within head_ttl. Clients that send If-Match on every part of a multipart
  # download, such as the AWS CLI `s3 cp` transfer client and Mountpoint for Amazon S3,
  # then skip one S3 round trip per ranged GET.
  # Any other conditional header (If-None-Match, If-Modified-Since,
  # If-Unmodified-Since), a mix of conditional headers, a mismatch or a miss is
  # forwarded to S3, and so is a request with a client cache-bypass header.
  # With false, every conditional request is forwarded, so S3 decides every
  # precondition. A cache_rules.json rule can override it per key.
  evaluate_conditions_from_cache: true

  # How long the loaded cache_rules.json is used before the proxy re-reads it (default:
  # 60s). The first lookup after this expires starts the re-read. A rule change takes
  # effect once that read completes, which is a later request if the read is slow.
  bucket_settings_staleness_threshold: "60s"

  # Cached ranges at or above this size are streamed from disk in chunks instead of
  # being loaded into memory whole (default: 1 MiB). This keeps memory down for large
  # range responses under high concurrency.
  disk_streaming_threshold: 1048576  # 1 MiB in bytes

  # Size of the batches a cache-miss write groups S3 bytes into before compressing each
  # batch into one LZ4 frame (default: 1 MiB; range 64 KiB to 16 MiB). Larger batches
  # compress better with less per-frame overhead; smaller batches use less memory per
  # request.
  compression_batch_size: 1048576

  # Largest .meta file the proxy reads, in bytes (default: 4 MiB). A larger file is
  # treated as corrupt without being read. It covers range lookups, validation against
  # HEAD, range invalidation and the RAM-hit recorder's extent read; other .meta reads,
  # including the lookup on a RAM metadata-cache miss, do not use it. A normal .meta file is about 2 KiB. Deprecated:
  # leave it unset. A value below 64 KiB (65536) is raised to 64 KiB with a startup
  # warning.
  # max_metadata_file_bytes: 4194304

  # Maximum concurrent blocking metadata reads per disk cache handle (default: 32), for
  # the same reads the size cap covers. Other .meta reads, including the lookup on a RAM
  # metadata-cache miss, are not counted. This limits load on the blocking thread pool and NFS.
  # Lower it for a constrained NFS mount; raise it for a local SSD with many cores.
  # A value of 0 is raised to 1 with a startup warning.
  # metadata_io_concurrency: 32

  # Smallest fraction (0.0-1.0) of a requested range that is kept when a streamed
  # cache write for a GET ends early (default: 0.5). If the client cancels, or the
  # mid-stream idle timeout aborts the transfer, but at least this fraction of the
  # bytes arrived in order, the received prefix is cached as a shorter range instead of
  # being discarded. A download whose part requests are sometimes cut short, as with
  # the AWS CRT transfer client, then still fills the cache. 1.0 caches only complete
  # ranges; 0.0 caches any non-empty prefix. Write cache uploads are unaffected: a
  # truncated upload is never cached.
  # partial_range_commit_ratio: 0.5

logging:
  # On a fleet, put the log directories on a shared file system other than the cache
  # volume, which nothing else should write to (see docs/SHARED_STORAGE.md). Shared log
  # directories give one listing across every proxy for a date, and let retention remove
  # files that a departed proxy left behind. Local log directories work but give up both.
  # See docs/ACCESS_LOG_FORMAT.md and docs/examples/config-production.yaml.
  access_log_dir: "./tmp/logs/access"  # Local development; on a fleet e.g. "/mnt/nfs/logs/access"
  app_log_dir: "./tmp/logs/app"        # Local development; on a fleet e.g. "/mnt/nfs/logs/app"
  # State that stays on the proxy's own host: the log of cache invalidations that the
  # cache volume refused (for example during a failover), kept across a restart. It must
  # be on the host's own disk. A directory inside cache_dir, or on a file system other
  # than ext2/3/4, XFS, btrfs, tmpfs, overlayfs, ZFS or f2fs, is refused, and the proxy
  # then keeps that log in memory only. Default: "/var/lib/s3-proxy", which the shipped
  # systemd unit creates with StateDirectory=s3-proxy. See docs/CONFIGURATION.md.
  # local_state_dir: "/var/lib/s3-proxy"
  access_log_enabled: true
  access_log_mode: "all"  # "all" (default) or "cached_only"
  log_level: "info"

  # Access log entries are buffered in RAM and written out periodically, which cuts
  # disk I/O on a shared file system.
  access_log_flush_interval: "5s"  # How often buffered entries are written (default: 5s)
  access_log_buffer_size: 1000     # Entries that force a write before the interval (default: 1000)

  # Log retention. Every proxy runs its own cleanup task, with no coordination between
  # proxies. Retention belongs to the directory: both sweeps run whether or not this
  # proxy writes access logs, and both remove files other proxies left behind. Only files
  # that follow the documented naming convention are removed.
  # A file this proxy did not write gets one extra day of grace, so a live writer's files
  # are kept retention_days and an orphaned file retention_days + 1. For a hard limit of
  # N days, set N-1. See docs/ACCESS_LOG_FORMAT.md.
  access_log_retention_days: 30              # Days to keep access log files (default: 30, range 1-365)
  app_log_retention_days: 30                 # Days to keep application log files (default: 30, range 1-365)
  log_cleanup_interval: "24h"                # How often cleanup runs (default: 24h, range 1h-7d)
  access_log_file_rotation_interval: "5m"    # How long one access log file is appended to before a new one starts (default: 5m, range 1m-60m)

connection_pool:
  # How often each S3 endpoint is resolved again (default: 60s). It is checked on every
  # pool_check_interval tick, so a value below pool_check_interval acts as
  # pool_check_interval.
  dns_refresh_interval: "60s"
  connection_timeout: "10s"  # Default: 10s
  idle_timeout: "55s"  # Default: 55s, range 1-300s. S3 can close an idle connection sooner; a GET or HEAD that meets one is retried once
  keepalive_enabled: true
  max_idle_per_host: 100  # Default: 100. More idle connections use more memory and save TLS handshakes during bursts
  # Maximum age of a pooled upstream connection (default: 300s, range 60-3600s). An older
  # connection is retired instead of reused; a request already running on it finishes
  # normally. /metrics counts retirements as max_lifetime_closures.
  max_lifetime: "300s"
  pool_check_interval: "10s"  # Default: 10s
  # DNS servers for upstream requests through the connection pool (default: empty, which
  # means the Google and Cloudflare public resolvers). The proxy never reads /etc/hosts
  # for these lookups. The HTTPS passthrough on port 443, CONNECT tunnels through the
  # TLS proxy listener, and destination-policy lookups on the HTTP forwarding path always
  # use the public resolvers. For S3 PrivateLink, list the IPs of a Route 53 Resolver
  # inbound endpoint.
  # dns_servers: ["10.0.1.50", "10.0.2.50"]
  #
  # endpoint_overrides: hostname-to-IP mappings used instead of DNS, for example for S3
  # PrivateLink where DNS cannot resolve S3 hostnames to the interface endpoint IPs
  # (such as on-premises without a Route 53 Resolver). Each key maps to a list of IPs,
  # and the proxy spreads requests across them. A key starting with "*." matches any
  # hostname ending in that suffix. An exact match wins over a suffix match, and among
  # suffix matches the longest suffix wins. Outbound TLS to a hostname that matches an
  # override is limited to TLS 1.2, for VPC interface endpoints; other hosts negotiate
  # TLS 1.2 or 1.3.
  #
  # endpoint_overrides:
  #   # Exact match: one hostname
  #   "s3.us-west-2.amazonaws.com": ["10.0.1.100", "10.0.2.100"]
  #
  #   # Suffix match: every virtual-hosted bucket hostname in a Region
  #   "*.s3.us-west-2.amazonaws.com": ["10.0.1.100", "10.0.2.100"]
  #
  #   # Suffix match: every Multi-Region Access Point hostname, through the global
  #   # access point VPC endpoint
  #   "*.accesspoint.s3-global.amazonaws.com": ["10.0.3.100"]
  #
  #   # Suffix match: regional access points
  #   "*.s3-accesspoint.us-west-2.amazonaws.com": ["10.0.1.100", "10.0.2.100"]
  #
  #   # Buckets in another Region
  #   "*.s3.eu-west-1.amazonaws.com": ["10.0.4.100", "10.0.4.101"]
  #
  # upstream_overrides: the transport to use for specific origins (default: empty, so
  # every origin gets verified TLS on port 443). Add entries only for stores you reach
  # on another transport. Each key is "host:port", and each value is
  # { scheme: http|https, validate_tls: <bool> }:
  #   - scheme: http                        -> plaintext HTTP, no TLS
  #   - scheme: https, validate_tls: true   -> HTTPS verified against the system trust store (default)
  #   - scheme: https, validate_tls: false  -> HTTPS with NO certificate verification
  # validate_tls defaults to true. There is no custom-CA mode: verification is full or none.
  #
  # Matching: an IP literal matches that IP only. A DNS name matches itself and any
  # subdomain, so "store.local:9000" also covers "bucket.store.local:9000" (path-style
  # and virtual-hosted addressing from one entry). A bare "*" is rejected. The upstream
  # hostname resolves through the DNS servers above, never /etc/hosts, so it must
  # resolve to the real origin, not back to the proxy. Independent of endpoint_overrides;
  # the two combine.
  #
  # Security: scheme: http exposes the proxy-to-origin hop in cleartext, and
  # validate_tls: false removes protection against interception on it. Use them only
  # for local development or on a secure network segment. The proxy logs a startup
  # warning for each such entry; verified HTTPS logs none.
  #
  # Upstream port: the port comes from the request. In forward-proxy mode the request's
  # absolute-form authority names the upstream host:port; the proxy connects to that
  # port when an upstream_overrides entry matches it, and otherwise uses verified TLS on
  # 443. In standard mode the port comes from the Host header (80 if absent), and the
  # proxy intercepts only its own http_port, plus the uncached HTTPS passthrough on 443.
  # Pointing http_port at a non-standard port intercepts that one port; reaching several
  # ports, or fronting a store elsewhere while listening on 80 and 443, needs the forward
  # proxy. In either mode an upstream_overrides entry on the target port selects the
  # transport.
  #
  # upstream_overrides:
  #   # Local plaintext store (for example MinIO or RustFS on :9000), development only
  #   "127.0.0.1:9000": { scheme: http }
  #
  #   # Store with a publicly trusted certificate on a port other than 443: verified HTTPS
  #   "store.example.com:9000": { scheme: https, validate_tls: true }
  #
  #   # Self-signed store on a secure network segment: HTTPS without verification
  #   "store.local:9000": { scheme: https, validate_tls: false }
  #
  # IP distribution: a separate connection pool per S3 IP address. The proxy rewrites
  # each request's authority from the hostname to one of the endpoint's IPs, so
  # connections spread across all of S3's front-end IPs instead of a few, which avoids
  # per-IP throttling. TLS SNI and the Host header keep the hostname, as SigV4 requires.
  ip_distribution_enabled: true  # Default: true
  # Maximum idle connections per IP when IP distribution is on (default: 10; range
  # 1-100). With N S3 IPs, typically about 8, that is about N x 10 = 80 idle
  # connections. With IP distribution off, max_idle_per_host applies instead.
  max_idle_per_ip: 10
  # TCP keepalive, set on each socket before the TLS handshake, so a dead connection is
  # detected before it is reused.
  keepalive_idle_secs: 15     # Seconds idle before the first probe (default: 15)
  keepalive_interval_secs: 5  # Seconds between probes (default: 5)
  keepalive_retries: 3        # Failed probes before the connection counts as dead (default: 3)
  # TCP receive buffer (SO_RCVBUF) in bytes (default: null, the kernel tunes it). Leave
  # it null: a fixed window limits single-stream bandwidth over high-latency
  # cross-Region paths, and setting any value turns off the kernel's auto-tuning (which
  # grows the window up to net.core.rmem_max).
  tcp_recv_buffer_size: null
  # Consecutive failures before an IP is taken out of rotation (default: 3). A DNS
  # refresh does not restore it; it returns only when a recovery probe (TCP connect and
  # TLS handshake) succeeds. See the health_probe_* settings below.
  ip_failure_threshold: 3
  # Recovery probes for excluded IPs. An excluded IP can be probed once
  # health_probe_initial_cooldown has passed, and probes run once per
  # pool_check_interval. A successful probe returns the IP to rotation at once. A failed
  # probe doubles that IP's cooldown, up to health_probe_max_cooldown, so an unreachable
  # IP is probed less and less often. connection_timeout bounds each probe. Lower the
  # initial cooldown to return an IP sooner after a transient failure; raise the maximum
  # to back off further from an IP that stays down.
  # health_probe_initial_cooldown: "5s"
  # health_probe_max_cooldown: "300s"
  # Maximum endpoints registered for IP distribution (default: 10000). This bounds growth
  # from many distinct hostnames; normal S3 use stays far below it. Endpoints already
  # registered keep working when the cap is reached.
  # max_registered_endpoints: 10000

  # Timeouts for the proxy's own S3 fetch, for responses that stall. They apply after a
  # request has its place in download coordination; time spent waiting there is not
  # counted.

  # Time from connecting to the first response byte (default: 5s). It sits above
  # typical cross-Region time-to-first-byte tails and well below the AWS CLI's 60s read
  # timeout. When it expires before any byte has gone to the client, the fetch is
  # retried up to upstream_idle_retries times.
  # upstream_first_byte_timeout: "5s"

  # Mid-stream idle timeout (default: 5s). If no byte arrives from S3 for this long after
  # data has started, the client connection is closed and the client retries. A slow but
  # steady transfer is never cut off.
  # upstream_idle_timeout: "5s"

  # Retries when the first-byte timeout expires before any byte has gone to the client
  # (default: 2).
  # upstream_idle_retries: 2

  # Hedged upstream requests: the per-proxy governor. A cache_rules.json rule turns
  # hedging on for a key pattern (hedging_enabled, hedge_trigger_after,
  # hedge_max_per_request); there is no global switch. This section only caps the share
  # of in-flight fetches that may be hedges, which bounds the extra S3 requests.
  # hedged_requests:
  #   # Maximum share of in-flight fetches that may be hedges (default: 0.1; range
  #   # 0.0-1.0). Above it, new hedges are suppressed. The first hedge is always admitted
  #   # when none is in flight, so 0.0 does not turn hedging off; remove hedging_enabled
  #   # from the rules for that. See docs/HEDGING.md.
  #   max_inflight_fraction: 0.1

compression:
  enabled: true
  # Size in bytes below which a write is never compressed, whatever its extension or
  # any cache_rules.json rule (default: 1024).
  threshold: 1024
  preferred_algorithm: "lz4"  # Only "lz4" is implemented; the field is parsed and has no other effect

# The health, metrics and dashboard listeners are the monitoring listeners. They are
# read-only and unauthenticated, and bind to 127.0.0.1 by default. This example binds
# them to 0.0.0.0, so restrict who can reach them with security groups, firewall rules
# or network segmentation.
health:
  enabled: true
  # Serves only GET /health; other paths return 404 and other methods 405.
  endpoint: "/health"
  port: 8080
  bind_address: "0.0.0.0"  # Opened here so a load balancer can check it
  check_interval: "30s"  # Accepted and ignored; a value other than 30s logs a warning

metrics:
  enabled: true
  # Serves only GET /metrics; other paths return 404 and other methods 405.
  endpoint: "/metrics"
  port: 9090
  bind_address: "0.0.0.0"  # Opened here so another host can scrape it
  # Period of the background metrics collection (default: 60s; a value outside
  # 10s-86400s is clamped with a warning). Each run reads the cache volume once,
  # supplies the cache-volume figures that /metrics and the dashboard serve (their age
  # is published as volume_snapshot.age_secs), and records the OTLP samples. The
  # proxy's own counters on /metrics are read live on every request. Collection runs
  # whenever /metrics, OTLP or the dashboard is enabled.
  collection_interval: "60s"
  otlp:
    enabled: false
    endpoint: "http://localhost:4318"
    export_interval: "60s"
    timeout: "10s"
    compression: "none"
    headers: {}
    # Per-bucket traffic is always tracked in memory; this gates only its OTLP export.
    # per_bucket_enabled: false      # Export per-bucket counters through OTLP (default: false)

  # Per-bucket metrics accounting, always on; it feeds /metrics and the dashboard.
  # metrics.otlp.per_bucket_enabled (above) gates the OTLP export.
  # per_bucket:
  #   max_series: 100              # Most distinct bucket or bucket+prefix series (default: 100)
  #                                # Traffic beyond this is counted under "__other__".
  #   bucket_prefixes:             # Optional prefix lists per bucket, for prefix-level counts
  #     my-bucket:                 # Key: bucket name. Value: list of prefixes.
  #       - "logs/"
  #       - "data/raw/"

dashboard:
  enabled: true
  port: 8081
  # The dashboard shows cache statistics, a log viewer and system information. It has
  # no write operations and exposes no credentials (presigned URL parameters are masked
  # in the logs it shows).
  # bind_address decides who can reach it:
  #   "127.0.0.1": this host only (the default); use an SSH tunnel for remote access
  #   "0.0.0.0":   every interface; restrict access with security groups, firewall
  #                rules or network segmentation
  # This example uses "0.0.0.0" so the dashboard is reachable. See docs/DASHBOARD.md,
  # "Security considerations", for what a non-loopback bind requires of you.
  # For remote access without opening the port, keep 127.0.0.1 and use an SSH tunnel:
  #   ssh -L 8081:127.0.0.1:8081 <proxy-host>
  # then open http://localhost:8081 in a browser.
  bind_address: "0.0.0.0"
  cache_stats_refresh_interval: "5s"  # Default: 5s
  logs_refresh_interval: "10s"  # Default: 10s

# ==============================================================================
# Example: proxy_only mode
# ==============================================================================
# Runs the forward proxy without the HTTP listener on port 80 or the HTTPS
# passthrough on 443, so it needs no root privileges and no DNS or /etc/hosts
# changes. Clients set HTTP_PROXY to route S3 traffic through it.
#
# With the TLS proxy listener, the recommended setup, the client hop is encrypted:
#
# server:
#   mode: "proxy_only"
#   proxy_port: 3128
#   tls:
#     enabled: true
#     tls_proxy_port: 3129
#     cert_path: "/etc/proxy/tls/cert.pem"
#     key_path: "/etc/proxy/tls/key.pem"
#
# cache:
#   cache_dir: "/mnt/cache"
#   max_cache_size: 524288000  # 500 MiB
#
# Client usage:
#   export HTTP_PROXY=https://<proxy-host>:3129
#   export NO_PROXY=169.254.169.254
#   aws s3 cp s3://<bucket>/<key> ./local \
#     --endpoint-url http://s3.us-east-1.amazonaws.com
#   # For repeated S3 commands against buckets in us-east-1:
#   export AWS_ENDPOINT_URL_S3=http://s3.us-east-1.amazonaws.com
#
# Only the AWS CRT transfer client verifies the proxy's certificate, and it needs the
# certificate in the client host's system trust store; AWS_CA_BUNDLE does not apply to
# the HTTP_PROXY hop. Botocore-based clients (aws s3api, aws s3 with the classic
# transfer client, boto3) encrypt the hop without verifying it. See
# docs/GETTING_STARTED.md, "Configuring clients to trust the certificate".
#
# On the proxy's own host, the cleartext forward proxy on port 3128 needs no
# certificate:
#   export HTTP_PROXY=http://127.0.0.1:3128
#   export NO_PROXY=169.254.169.254
#   aws s3 cp s3://<bucket>/<key> ./local \
#     --endpoint-url http://s3.us-east-1.amazonaws.com
#
# SigV4 authenticates each request but does not encrypt it; see
# docs/ARCHITECTURE.md, "What a cleartext hop exposes".
# ==============================================================================

# ==============================================================================
# Download bandwidth QoS (default: off)
#
# Caps the total bytes per second the proxy pulls from S3 on cache misses, and
# shares that budget fairly across callers (the User-Agent app ID) or buckets. Cache
# hits are never throttled. Leaving this section out leaves the feature off.
# See docs/BANDWIDTH_QOS.md.
# ==============================================================================
download_bandwidth:
  # Cache-miss download ceiling in bytes per second; 0 means no limit (default).
  # Example: 524288000 is 500 MiB/s.
  max_bytes_per_sec: 0

  # Caller identity as the fairness key (default: off, so the bucket is the key).
  caller_id:
    # When true, the key is the `app/<value>` part of the User-Agent header. AWS SDK
    # clients add it through the AWS_SDK_UA_APP_ID environment variable or the
    # sdk_ua_app_id configuration setting. The proxy does not interpret the value, so
    # a per-user or per-application convention is up to you.
    enabled: false
    # Optional regex the value must match; a value that does not match falls back to
    # the bucket key. It is compiled once at startup, and an invalid regex stops startup.
    # validation_regex: "^[a-z0-9_-]{1,32}$"
    # Maximum length of the value, in characters (default: 64).
    max_len: 64

  # Most fairness classes tracked as separate metric series (default: 1024). Classes
  # beyond this are counted in one "residual" series, and are still throttled and
  # counted toward the ceiling.
  max_tracked_classes: 1024

  # Fleet sharing: each proxy's ceiling is max_bytes_per_sec divided by the number of
  # live proxies, N. This matters only on a fleet.
  fleet:
    # Floor on N (default: 1). Every ceiling update divides by
    # max(N, fallback_instance_count), and a failed read of N reuses the last good N,
    # which starts at this value. On a fleet, set it to the fleet size, so a failed
    # read throttles conservatively instead of not at all.
    fallback_instance_count: 1
    # How recent a proxy's heartbeat must be for it to count toward N (default: 90s,
    # three refresh intervals). A value below twice refresh_interval is raised to three
    # times refresh_interval with a startup warning, because a live proxy's heartbeat
    # can be up to one interval old when another proxy reads it.
    instance_staleness: "90s"
    # How often the proxy reads the heartbeats and updates its ceiling (default: 30s).
    # A value below 10s stops startup.
    refresh_interval: "30s"
