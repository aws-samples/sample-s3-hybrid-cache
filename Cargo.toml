[package]
name = "s3-proxy"
version = "3.0.0"
edition = "2021"
# MSRV. `time` and `hickory-{resolver,proto,net}` declare rust-version = "1.88", so the floor
# cannot go below 1.88 whatever this crate does. 1.89 is retained rather than lowered to 1.88:
# the one-release gain does not justify carrying an obligation to keep a 1.88 release build green.
rust-version = "1.89"
# Test targets are declared explicitly below (the [[test]] block at the end of this file), not
# auto-discovered from tests/*.rs. A test file must be a module of one tests/group_*.rs binary or
# have a [[test]] entry of its own; a file in neither place is never built or run. Why: linking 255
# opt-level-3 test crates, each with the whole library, dominates the time of a full test run.
autotests = false

[dependencies]
# Async runtime and HTTP server
tokio = { version = "1.0", features = ["full"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body = "1.0"
http-body-util = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.9"

# TLS support
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
# rustls-native-certs: OS trust store loader (0.8 drops rustls-pemfile dep, resolves RUSTSEC-2025-0134)
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# Service abstraction for connection pooling (used by CustomHttpsConnector in https_connector.rs)
tower = "0.5"

# Compression
lz4_flex = "0.11.6"
# xxhash32, matching the version lz4_flex itself uses internally for frame
# checksums. Used directly by the store-mode frame writer in compression.rs
# (see compression-content-aware-fix spec) to hand-roll a valid LZ4 frame with
# uncompressed blocks — avoiding the LZ4 compressor entirely while still
# producing a checksummed frame that lz4_flex::frame::FrameDecoder can read.
twox-hash = "2.1.2"

# Hashing
blake3 = "1.5"

# File locking for shared cache coordination
fs4 = "1.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
tracing-appender = "0.2"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Networking and DNS (hickory is the maintained successor to trust-dns)
hickory-resolver = "0.26"
socket2 = { version = "0.5", features = ["all"] }

# Configuration
clap = { version = "4.0", features = ["derive"] }

# Error handling
thiserror = "1.0"

# Async trait support (for dyn-compatible async traits)
async-trait = "0.1"

# RAII guard for cleanup
scopeguard = "1.2"

# Utilities
uuid = { version = "1.0", features = ["v4"] }
bytes = "1.0"
futures = "0.3"
tokio-stream = "0.1"
gethostname = "0.4"
hostname = "0.3"
libc = "0.2"
httpdate = "1.0"
urlencoding = "2.1"
percent-encoding = "2.3"
regex = "1.0"
fastrand = "2.0"
# Inline storage for the 1-or-2-element page lists produced by page-aligned
# range caching's overlapping-page computation (spec: page-aligned-range-cache).
# Avoids a heap allocation for the common case (a single page).
smallvec = "1.15.1"

# Cache size tracking
rayon = "1.8"
walkdir = "2.4"

# Concurrent data structures
dashmap = "6.0"

# OpenTelemetry for OTLP metrics export (0.29 uses rand 0.9, fully resolves RUSTSEC-2026-0097).
# Bumped to 0.32 for GHSA-w9wp-h8wv-79jx / CVE-2026-48504 (opentelemetry_sdk baggage
# propagation unbounded allocation, fixed in opentelemetry_sdk 0.32.1). All four
# opentelemetry crates must move together — they share types (KeyValue, MeterProvider,
# PushMetricExporter) across crate boundaries, and a partial bump leaves two
# incompatible copies of `opentelemetry`/`opentelemetry_sdk` in the dependency graph
# (fails to compile with "multiple different versions of crate X in the dependency
# graph" — see the reverted GitHub PR #10 that only bumped opentelemetry_sdk alone).
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics", "rt-tokio"] }
# The exporter's HTTP client must be the BLOCKING reqwest client: opentelemetry_sdk's
# PeriodicReader exports from its own plain thread (`futures_executor::block_on`, no
# Tokio reactor), so the async `reqwest-client` panics there on the first export
# ("there is no reactor running") and the reader thread dies silently — no metrics
# ever leave the process. The crate builds the blocking client on a helper thread,
# so constructing the exporter from inside the Tokio runtime (initialize()) is fine.
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["metrics", "http-proto", "reqwest-blocking-client"] }
opentelemetry-semantic-conventions = "0.32"


[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["test-util"] }  # start_paused and time::pause in tests; tokio-test used to enable this
tempfile = "3.0"
filetime = "0.2"
quickcheck = "1.0"
quickcheck_macros = "1.0"
rcgen = "0.13"
hex = "0.4"
sha2 = "0.10"  # Content digests in tests only; production code never hashes with it
webpki-roots = "1"  # Unit tests in https_connector.rs only; production trusts the OS store
opentelemetry_sdk = { version = "0.32", features = ["metrics", "rt-tokio", "testing"] }  # testing enables InMemoryMetricExporter

[[example]]
name = "compression_demo"
path = "examples/compression_demo.rs"

[[example]]
name = "cache_consistency_demo"
path = "examples/cache_consistency_demo.rs"

[[example]]
name = "cache_key_sanitization_demo"
path = "examples/cache_key_sanitization_demo.rs"

[[example]]
name = "presigned_url_demo"
path = "examples/presigned_url_demo.rs"

[[example]]
name = "resolve_settings_bench"
path = "examples/resolve_settings_bench.rs"
[[example]]
name = "ram_cache_shard_contention_bench"
path = "examples/ram_cache_shard_contention_bench.rs"

# ─── Profile tuning: reduce peak linker memory during test builds ───
# The lib-test binary links the entire crate + heavy deps (tokio-full, hyper-full,
# rustls, opentelemetry, rayon, hickory-resolver). With the default 16 codegen-units
# in release, each link spikes RSS and OOM-kills the process on machines with ≤32 GB.
# Raising codegen-units to 256 for tests produces smaller object files that link with
# less peak RSS. opt-level=1 further shrinks intermediate artifacts vs opt-level=3.
# This does NOT affect `cargo build --release` (the shipping binary) — only test/bench.

[profile.test]
opt-level = 1
codegen-units = 256
lto = false
# Cut link-time memory for the lib-test binary (whole crate + heavy dep graph +
# dev-deps + ~1300 inline tests statically linked). Full debuginfo=2 is the single
# biggest contributor to the link's peak RSS and was OOM-SIGKILLing the link on
# memory-constrained machines. line-tables-only keeps panic backtraces with
# file:line while dropping the heavy variable/type DWARF. Pair with
# CARGO_INCREMENTAL=0 for local runs.
debug = "line-tables-only"

[profile.bench]
opt-level = 2
codegen-units = 256
lto = false

# Release profile: disable LTO for faster links with lower peak memory.
# The proxy is network-bound, not CPU-bound — LTO gains are negligible.
[profile.release]
lto = false
codegen-units = 16

# ─── Test targets: group binaries, so a test run links a few dozen crates and not 255 ───
# `autotests = false` turns off cargo's automatic one-target-per-tests/*.rs rule, which made every
# test run compile and link 255 opt-level-3 crates that each link the whole library.
# Each `group_*` target compiles many tests/*.rs files as modules of one binary; the files do not
# move and their contents are unchanged. The targets listed after the groups keep their own
# process because their verdict depends on state shared by the whole process (a #[global_allocator],
# a global tracing subscriber, a process-global counter or a process-wide _for_tests seam) or on a
# timing budget, so a second file in the same binary could perturb them. The comment above each
# gives the reason.
#
# A new tests/*.rs file is NOT picked up automatically. Register it in one of two ways: add a
# `#[path = "<file>.rs"]` / `mod <stem>;` pair to the tests/group_*.rs for its subject, or, if it
# holds process-global state, give it a [[test]] entry below with the reason as a comment.
[[test]]
name = "group_config"
path = "tests/group_config.rs"

[[test]]
name = "group_eviction"
path = "tests/group_eviction.rs"

[[test]]
name = "group_journal"
path = "tests/group_journal.rs"

[[test]]
name = "group_keys"
path = "tests/group_keys.rs"

[[test]]
name = "group_metrics"
path = "tests/group_metrics.rs"

[[test]]
name = "group_multipart"
path = "tests/group_multipart.rs"

[[test]]
name = "group_other"
path = "tests/group_other.rs"

[[test]]
name = "group_ramtier"
path = "tests/group_ramtier.rs"

[[test]]
name = "group_readpath"
path = "tests/group_readpath.rs"

[[test]]
name = "group_revalidation"
path = "tests/group_revalidation.rs"

[[test]]
name = "group_write"
path = "tests/group_write.rs"

# Isolated targets: one binary each, reason per line.
# buffered_serve_memory_bound_test: #[global_allocator] at :97 (one per binary) and process-global buffered_serve_*_total() counters
