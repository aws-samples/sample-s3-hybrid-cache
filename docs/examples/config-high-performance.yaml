# Large-cache configuration: a 1 TiB disk cache and a 10 GiB RAM cache, with
# the connection pool and dashboard refresh settings shown below.
#
# Verified to load with: s3-proxy --config docs/examples/config-high-performance.yaml

server:
  http_port: 80
  https_port: 443
  max_concurrent_requests: 1000

cache:
  # Make this the root of its own storage unit; see the cache_dir comment in
  # config-production.yaml and docs/SHARED_STORAGE.md. The consumed-bytes
  # reading covers the whole file system, so anything else on that file system
  # is charged to the cache. That rules out `/var/cache` on a stock install, and
  # it is why the logs below sit on a separate mount rather than beside the cache.
  cache_dir: "/mnt/cache"
  max_cache_size: 1099511627776     # 1 TiB
  ram_cache_enabled: true
  max_ram_cache_size: 10737418240   # 10 GiB
  eviction_algorithm: "tinylfu"
  eviction_trigger_percent: 95
  eviction_target_percent: 80

connection_pool:
  keepalive_enabled: true
  max_idle_per_host: 100

compression:
  enabled: true
  threshold: 1024
  preferred_algorithm: "lz4"

logging:
  # On the shared config volume rather than the cache volume; see the cache_dir
  # comment above, and config-production.yaml for why the logs are shared rather
  # than local to each proxy.
  access_log_dir: "/mnt/nfs/logs/access"
  app_log_dir: "/mnt/nfs/logs/app"
  log_level: "info"

dashboard:
  enabled: true
  port: 8081
  bind_address: "127.0.0.1"
  cache_stats_refresh_interval: "10s"
  logs_refresh_interval: "15s"
